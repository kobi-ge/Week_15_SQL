apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: kobigdocker/api-sqldb:v2
          ports:
            - containerPort: 8000
          env:
          - name: host
            value: "mysql-service"
          - name: user
            value: "root"
          - name: password
            value: "rootpassword"
          - name: database
            value: "classicmodels"
